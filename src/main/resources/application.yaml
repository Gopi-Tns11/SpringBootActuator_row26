server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

  info:
    env:
      enabled: true

info:
  app:
    name: Spring Boot Monitoring
    description: Spring Boot Actuator Monitoring Application
    version: 1.0.0